<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>MoneshSys Technologies Staff</title>

    <meta name="description"
          content="Meet the team at MoneshSys Technologies, including Bevan Jude, Manager – Logo Design.">

    <link rel="canonical" href="https://staff.moneshsys.com/">

    <link rel="icon" href="favicon.png" type="image/png">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #17202a;
        }

        header {
            background: #071b24;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            vertical-align: middle;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .staff-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            max-width: 350px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .staff-card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: auto;
        }

        .staff-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .role {
            text-align: center;
            color: #007c91;
            font-weight: bold;
        }

        .profile-button {
            display: block;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            background: #00cfff;
            color: #00151c;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png"
         alt="MoneshSys Technologies Logo"
         class="logo">

    <h1>MoneshSys Technologies Staff</h1>

    <p>Meet our team</p>
</header>

<main>

    <h2>Our Team</h2>

    <div class="staff-card">

        <img src="bevan.jpg"
             alt="Bevan Jude - Manager Logo Design at MoneshSys Technologies">

        <h2>Bevan Jude</h2>

        <p class="role">Manager – Logo Design</p>

        <p>
            Bevan Jude is the Manager – Logo Design at
            MoneshSys Technologies.
        </p>

        <a class="profile-button"
           href="bevan-jude.html">
            View Bevan Jude's Profile
        </a>

    </div>

</main>

</body>
</html>
